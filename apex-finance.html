<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APEX Finance</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#02060a;--panel:rgba(4,18,24,.82);--cyan:#3df2ff;--cyan-dim:#0f4a54;--orange:#ff9a3c;--ink:#d6f7ff;--dim:#6b98a3;--good:#49f2a5;--bad:#ff6b6b;
--f-display:"Oxanium","Rajdhani",system-ui,sans-serif;--f-mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-display)}
body{padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));max-width:1180px;margin:0 auto}
a{color:var(--cyan)}
h1{font-size:22px;letter-spacing:.14em;margin:6px 0 2px;color:var(--cyan)}
h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin:0 0 8px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sub{color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.card,.panel{background:var(--panel);border:1px solid var(--cyan-dim);border-radius:10px;padding:12px}
.panel{margin-bottom:14px;overflow-x:auto}
.k{color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.v{font:22px var(--f-mono);margin-top:2px}
.v.good{color:var(--good)}.v.bad{color:var(--bad)}.v.warn{color:var(--orange)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:6px 8px;border-bottom:1px solid rgba(61,242,255,.12);text-align:left;vertical-align:top}
th{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--cyan-dim);font-size:11px}
.pill.good{color:var(--good);border-color:var(--good)}.pill.warn{color:var(--orange);border-color:var(--orange)}.pill.bad{color:var(--bad);border-color:var(--bad)}
button,.btn{background:transparent;color:var(--cyan);border:1px solid var(--cyan);border-radius:8px;padding:7px 14px;font:600 13px var(--f-display);cursor:pointer;text-decoration:none;min-height:36px}
button:hover{background:rgba(61,242,255,.12)}button:disabled{opacity:.45;cursor:default}
button.ghost{color:var(--dim);border-color:var(--cyan-dim)}
input,select{background:#031219;color:var(--ink);border:1px solid var(--cyan-dim);border-radius:6px;padding:4px 6px;font:13px var(--f-display);max-width:170px}
.msg{padding:8px 12px;border-radius:8px;border:1px solid var(--orange);color:var(--orange);margin-bottom:10px}
.note{color:var(--dim);font-size:12px;margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ul{margin:4px 0 0;padding-left:18px}
@media(max-width:600px){h1{font-size:18px}.v{font-size:18px}}
</style>
</head>
<body>
<div class="top">
  <div><h1>APEX FINANCE</h1><div class="sub" id="status">Loading…</div></div>
  <div class="row"><a class="btn ghost" href="/">Back to Sarah</a><button id="scan" type="button">Scan statements now</button></div>
</div>
<div id="app"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const money = n => (n == null ? '–' : (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-CA', {minimumFractionDigits: 2, maximumFractionDigits: 2}));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v); }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const card = (k, v, cls, sub) => h('div', {class: 'card'}, h('div', {class: 'k'}, k), h('div', {class: 'v ' + (cls || '')}, v), sub ? h('div', {class: 'sub'}, sub) : null);
const pill = (t, c) => h('span', {class: 'pill ' + (c || '')}, t);
function table(head, rows, numCols) {
  const nc = new Set(numCols || []);
  return h('table', {}, h('thead', {}, h('tr', {}, head.map((x, i) => h('th', {class: nc.has(i) ? 'n' : ''}, x)))),
    h('tbody', {}, rows.map(r => h('tr', {}, r.map((c, i) => h('td', {class: nc.has(i) ? 'n' : ''}, c))))));
}
function panel(title, ...kids) { return h('div', {class: 'panel'}, h('h2', {}, title), kids); }
async function api(method, url, body) {
  const r = await fetch(url, {method, credentials: 'same-origin', headers: {'Content-Type': 'application/json', 'X-Sarah': '1'}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { location.href = '/'; throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
function mailOutbox(box, m) {
  const f = {};
  const inp = (k, ph, attrs) => (f[k] = h('input', Object.assign({'aria-label': ph, placeholder: ph, style: 'width:100%'}, attrs || {})));
  const body = (f.body = h('textarea', {rows: 6, style: 'width:100%', 'aria-label': 'Message', placeholder: 'Message'}));
  const opts = [];
  (m.messages || []).forEach(x => (x.attachments || []).forEach(a => opts.push({uid: x.uid, name: a, label: `${a}  (from "${x.subject.slice(0, 40)}", ${x.date.slice(0, 10)})`})));
  const sel = (f.attach = h('select', {multiple: 'multiple', size: Math.min(4, Math.max(2, opts.length)), 'aria-label': 'Attach from inbox', style: 'width:100%'}, opts.map((o, i) => h('option', {value: String(i)}, o.label))));
  const save = h('button', {type: 'button', onclick: async () => {
    const attach = [...sel.selectedOptions].map(o => ({uid: opts[+o.value].uid, name: opts[+o.value].name}));
    try { renderMail(box, await api('POST', '/api/apex/mail-draft', {to: f.to.value, cc: f.cc.value, subject: f.subject.value, body: body.value, attach})); } catch (e) { alert(e.message); }
  }}, 'Save as draft');
  const drafts = (m.outbox || []).map(it => {
    const card = h('div', {class: 'note', style: 'margin:8px 0;white-space:pre-wrap'});
    card.append(h('b', {}, `${it.status.toUpperCase()}: ${it.subject}`), `\nTo: ${it.to.join(', ')}${it.cc.length ? '   Cc: ' + it.cc.join(', ') : ''}\n${it.attach.length ? 'Attached: ' + it.attach.map(a => a.name).join(', ') + '\n' : ''}\n${it.body}`);
    if (it.error) card.append(`\nLast error: ${it.error}`);
    if (it.status === 'sent') { card.append(`\nSent ${it.sent}`); return card; }
    const send = h('button', {type: 'button', onclick: async () => {
      if (!confirm(`Send this email now from ${m.user}?\n\nTo: ${it.to.join(', ')}${it.cc.length ? '\nCc: ' + it.cc.join(', ') : ''}\nSubject: ${it.subject}${it.attach.length ? '\nAttached: ' + it.attach.map(a => a.name).join(', ') : ''}`)) return;
      send.disabled = true; send.textContent = 'Sending…';
      try { renderMail(box, await api('POST', '/api/apex/mail-send', {id: it.id, approved: true})); } catch (e) { alert(e.message); loadMail(box); }
    }}, 'Approve & send');
    const del = h('button', {type: 'button', onclick: async () => { try { renderMail(box, await api('POST', '/api/apex/mail-discard', {id: it.id})); } catch (e) { alert(e.message); } }}, 'Discard');
    card.append(h('div', {class: 'row', style: 'margin-top:8px;gap:8px'}, send, del));
    return card;
  });
  return h('div', {}, h('h3', {}, 'Send email (only after you approve)'),
    h('div', {class: 'sub'}, `Nothing leaves until you press Approve & send on a saved draft. It is sent from ${m.user} and logged.`),
    drafts, h('div', {style: 'display:grid;gap:6px;margin-top:8px'}, inp('to', 'To (comma separated)'), inp('cc', 'Cc'), inp('subject', 'Subject'), body,
      opts.length ? h('div', {class: 'sub'}, 'Attach from inbox (Ctrl/Cmd-click for several)') : '', opts.length ? sel : '', h('div', {class: 'row'}, save)));
}
function renderMail(box, m) {
  box.replaceChildren();
  if (!m.configured) { box.append(h('div', {class: 'note'}, `Not connected yet. Add the mailbox password to Sarah on the NAS (SARAH_APEX_MAIL_PASS), then restart her. Sarah reads ${m.user} and sends only what you approve; she never moves or deletes mail.`)); return; }
  const btn = h('button', {type: 'button', onclick: async () => { btn.disabled = true; btn.textContent = 'Checking…'; try { renderMail(box, await api('POST', '/api/apex/mail-check')); } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = 'Check mail now'; } }}, 'Check mail now');
  box.append(h('div', {class: 'sub'}, `Reading is read-only: last checked ${m.checked || 'never'} (auto every 6 hours). PDF/photo attachments are copied into the Vendor Invoices Inbox; received mail is left untouched.`),
    m.error ? h('div', {class: 'note'}, m.error) : '',
    h('div', {class: 'row', style: 'margin:8px 0'}, btn),
    m.messages.length ? table(['Date (UTC)', 'From', 'Subject', 'Files'], m.messages.map(x => [x.date, x.from, x.subject + (x.new ? '  (new)' : ''), String((x.attachments || []).length || '')]), [3]) : h('div', {class: 'sub'}, 'No mail read yet.'),
    mailOutbox(box, m));
}
async function loadMail(box) {
  try { renderMail(box, await api('GET', '/api/apex/mail')); } catch (e) { box.replaceChildren(h('div', {class: 'sub'}, 'Mailbox status unavailable.')); }
}
function renderReport(box, j) {
  box.replaceChildren();
  const r = j.report;
  const mi = h('input', {type: 'month', value: r.month, onchange: e => e.target.value && loadReport(box, e.target.value)});
  const prog = h('textarea', {rows: 4, style: 'width:100%', 'aria-label': 'Progress notes', placeholder: 'Progress this month, one per line (permits, equipment arrived, opening date…)'}, (r.progress || []).join('\n'));
  const dec = h('textarea', {rows: 3, style: 'width:100%', 'aria-label': 'Decisions needed', placeholder: 'Decisions needed from partners, one per line'}, '');
  const save = h('button', {type: 'button', onclick: async () => {
    const lines = t => t.value.split('\n').map(x => x.trim()).filter(Boolean);
    try { renderReport(box, await api('POST', '/api/apex/report-notes', {month: r.month, progress: lines(prog), decisions: lines(dec)})); } catch (e) { alert(e.message); }
  }}, 'Save notes');
  const copy = h('button', {type: 'button', onclick: () => navigator.clipboard && navigator.clipboard.writeText(j.text).then(() => { copy.textContent = 'Copied'; })}, 'Copy snapshot');
  box.append(h('div', {class: 'sub'}, 'Sarah drafts this on the 1st for the month just ended (draft only; you review and send). Figures come from the workbook and statements; add the progress notes yourself.'),
    h('div', {class: 'row', style: 'margin:8px 0;gap:8px'}, h('span', {}, 'Month'), mi, copy),
    h('pre', {style: 'white-space:pre-wrap;font:inherit;margin:8px 0'}, j.text),
    h('div', {class: 'sub'}, 'Progress notes'), prog, h('div', {class: 'sub'}, 'Decisions needed'), dec,
    h('div', {class: 'row', style: 'margin-top:8px'}, save));
}
async function loadReport(box, month) {
  try { renderReport(box, await api('GET', '/api/apex/report' + (month ? '?month=' + encodeURIComponent(month) : ''))); } catch (e) { box.replaceChildren(h('div', {class: 'sub'}, e.message)); }
}
let DATA = null;
function render(d) {
  DATA = d;
  const s = d.summary, k = s.kpi, app = $('app');
  app.replaceChildren();
  $('status').textContent = s.found
    ? `Workbook read: ${s.rows} ledger rows${s.added_by_sarah ? ` (${s.added_by_sarah} added through Sarah)` : ''}. Last entry ${s.last_entry || '–'}. Statements last scanned ${d.scanned ? d.scanned.replace('T', ' ') : 'never'}.`
    : 'Cost Controller workbook not found in Finance. Check the APEX Physio project folder.';
  if (!s.found) { app.append(h('div', {class: 'msg'}, 'Put APEX_PHYSIO_Cost_Controller.xlsx in the project Finance folder.')); return; }
  const need = [];
  if (d.proposals.length) need.push(`${d.proposals.length} statement line(s) waiting for your approval`);
  Object.entries(d.statements.missing || {}).forEach(([a, m]) => need.push(`${a} statement missing: ${m.join(', ')}`));
  (d.reminders || []).forEach(r => need.push(r.title.replace(/^APEX: /, '')));
  if (s.flags.length) need.push(`${s.flags.length} ledger row(s) flagged ⚠ in the workbook`);
  app.append(panel('Needs your attention', need.length ? h('ul', {}, need.map(x => h('li', {}, x))) : h('div', {class: 'sub'}, 'Nothing waiting. The ledger ties to the bank.')));
  const bank = Object.values(d.statements.balances || {}).reduce((a, b) => a + (b.balance || 0), 0);
  const li = ((s.loc && s.loc.facilities) || []).reduce((a, f) => a + f.available, 0);
  app.append(h('div', {class: 'grid'},
    card('Funds in', money(k.funds_in), '', `Capital ${money(k.capital_in)} · Loans ${money(k.loan_in)}`),
    card('Spent', money(k.spent), '', `Property ${money(k.property)} · Other ${money(k.expenses)}`),
    card('OpCo bank balance', money(bank), 'good', 'Latest OpCo statement'),
    card('Cash per ledger', money(k.cash_on_hand)),
    card('Still to settle', money(k.to_settle), k.to_settle > 0 ? 'warn' : 'good', `Due invoices ${money(k.unpaid_invoices)} · Owed to Adeel ${money(k.owed_adeel)} · Zara ${money(k.owed_zara)}`),
    card('BMO credit available', money(li), '', 'Uncommitted facilities, 75% of pre-tax invoices')));

  // proposals
  if (d.proposals.length) {
    const sel = new Set(d.proposals.map(p => p.id));
    const rows = d.proposals.map(p => {
      const cb = h('input', {type: 'checkbox', checked: 'checked', 'aria-label': 'Select row', onchange: e => e.target.checked ? sel.add(p.id) : sel.delete(p.id)});
      const type = h('select', {'data-f': 'type', 'data-id': p.id}, ['Capital-In', 'Income', 'Loan-In', 'Expense', 'Purchase', 'Reimbursement', 'Loan-Repay', 'Transfer'].map(t => h('option', {value: t, selected: t === p.type ? 'selected' : null}, t)));
      const cat = h('input', {'data-f': 'category', 'data-id': p.id, value: p.category});
      return [cb, p.date, p.account, type, cat, p.desc + (p.notes ? '  ·  ' + p.notes : ''), p.in ? money(p.in) : '', p.out ? money(p.out) : ''];
    });
    const act = async approve => {
      if (!sel.size) return;
      const edits = {};
      document.querySelectorAll('[data-f]').forEach(el => { (edits[el.dataset.id] = edits[el.dataset.id] || {})[el.dataset.f] = el.value; });
      try { render(await api('POST', '/api/apex/decide', {ids: [...sel], approve, edits})); } catch (e) { alert(e.message); }
    };
    app.append(panel('Proposed ledger rows (from BMO statements)', h('div', {class: 'sub'}, 'Check the type and category, then approve. Approved rows are saved next to the statements and added to the workbook later. Sarah never pays or sends anything.'),
      table(['', 'Date', 'Account', 'Type', 'Category', 'Line', 'In', 'Out'], rows, [6, 7]),
      h('div', {class: 'row', style: 'margin-top:10px'}, h('button', {type: 'button', onclick: () => act(true)}, 'Approve selected'), h('button', {type: 'button', class: 'ghost', onclick: () => act(false)}, 'Reject selected'))));
  }

  // reconcile + coverage
  const rec = d.statements.reconcile || [];
  app.append(panel('OpCo: ledger vs bank statements', table(['Account', 'Through', 'Statement', 'Ledger', 'Difference', ''],
    rec.map(r => [r.account, r.through, money(r.statement), money(r.ledger), money(r.difference), r.difference === 0 ? pill('ties', 'good') : pill('check', 'bad')]), [2, 3, 4]),
    h('div', {class: 'note'}, Object.entries(d.statements.coverage || {}).map(([a, f]) => `${a}: ${f.length} statement(s), ${f[0].start} to ${f[f.length - 1].period_end}`).join('  ·  '))));

  // vendor invoices (inbox -> per-vendor folders)
  const vi = d.vendors || {inbox: [], vendors: [], known: []};
  const dl = h('datalist', {id: 'vendors'}, (vi.known || []).map(v => h('option', {value: v})));
  const up = h('input', {type: 'file', multiple: 'multiple', accept: '.pdf,.jpg,.jpeg,.png,.heic,.webp,application/pdf,image/*', id: 'upfile'});
  const upBtn = h('button', {type: 'button', onclick: async () => {
    const files = [...up.files]; if (!files.length) return;
    upBtn.disabled = true;
    try {
      let last = null;
      for (const f of files) {
        const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
        last = await api('POST', '/api/apex/upload', {name: f.name, data});
      }
      if (last) render(last);
    } catch (e) { alert(e.message); }
    upBtn.disabled = false;
  }}, 'Upload to Inbox');
  const vsel = new Set((vi.inbox || []).filter(x => x.vendor).map(x => x.id));
  const irows = (vi.inbox || []).map(x => {
    const cb = h('input', {type: 'checkbox', 'aria-label': 'Select invoice', checked: x.vendor ? 'checked' : null, onchange: e => e.target.checked ? vsel.add(x.id) : vsel.delete(x.id)});
    const vend = h('input', {list: 'vendors', 'data-vf': 'vendor', 'data-id': x.id, value: x.vendor, placeholder: 'Vendor', onchange: e => e.target.value ? vsel.add(x.id) : null});
    const dat = h('input', {type: 'date', 'data-vf': 'date', 'data-id': x.id, value: x.date});
    return [cb, x.file + (x.kind === 'photo' ? '  (photo, pick vendor)' : ''), vend, dat, x.total != null ? money(x.total) : '–'];
  });
  const fileBtn = h('button', {type: 'button', onclick: async () => {
    const items = [...vsel].map(id => { const g = f => (document.querySelector(`[data-vf="${f}"][data-id="${id}"]`) || {}).value || ''; return {id, vendor: g('vendor'), date: g('date')}; }).filter(i => i.vendor);
    if (!items.length) { alert('Pick a vendor for the selected invoices first.'); return; }
    try { render(await api('POST', '/api/apex/file', {items})); } catch (e) { alert(e.message); }
  }}, 'File selected');
  app.append(panel('Vendor invoices', dl,
    h('div', {class: 'sub'}, `Everything that arrives goes into one Inbox (S:\\APEX Physio\\${vi.path || 'Vendor Invoices\\Inbox'}). Drop files there from your phone or upload here. Sarah suggests the vendor; you approve and she files each one under Vendor Invoices\\<Vendor>\\<month>. Nothing is paid or deleted.`),
    h('div', {class: 'row', style: 'margin:8px 0'}, up, upBtn),
    irows.length ? [table(['', 'File', 'Vendor', 'Invoice date', 'Total'], irows, [4]), h('div', {class: 'row', style: 'margin-top:10px'}, fileBtn)] : h('div', {class: 'sub'}, 'Inbox is empty.'),
    (vi.vendors || []).length ? [h('div', {style: 'height:8px'}), table(['Vendor folder', 'Files', 'Latest month'], vi.vendors.map(v => [v.vendor, String(v.files), v.latest]), [1])] : null));

  // monthly partner snapshot
  const repBox = h('div', {}, h('div', {class: 'sub'}, 'Loading…'));
  app.append(panel('Monthly partner snapshot', repBox));
  loadReport(repBox, null);

  // add an unpaid bill
  const pf = {};
  const fld = (k, label, attrs) => { pf[k] = h('input', Object.assign({'aria-label': label, placeholder: label}, attrs || {})); return pf[k]; };
  app.append(panel('Add a bill (payable, or paid personally by a partner)',
    h('div', {class: 'sub'}, 'Records it in the ledger as Due. Nothing is paid; the bank balance does not change until the payment shows on a statement.'),
    h('div', {class: 'row', style: 'margin:8px 0;flex-wrap:wrap;gap:8px'},
      (pf.fronted = h('select', {'aria-label': 'Who paid'}, h('option', {value: ''}, 'Unpaid (Due)'), ['Huzefa', 'Zara', 'Adeel'].map(n => h('option', {value: n}, 'Paid by ' + n)))),
      fld('date', 'Invoice date', {type: 'date'}), fld('desc', 'Vendor and invoice no.'), fld('category', 'Category (e.g. Gym Fit-Out)'), fld('amount', 'Total incl. GST', {type: 'number', step: '0.01'}),
      h('button', {type: 'button', onclick: async () => {
        try { render(await api('POST', '/api/apex/payable', {date: pf.date.value, desc: pf.desc.value, category: pf.category.value, amount: pf.amount.value, account: 'OpCo', shared: true, fronted_by: pf.fronted.value, notes: pf.fronted.value ? `Paid personally by ${pf.fronted.value} – OWED BACK from OpCo.` : ''})); }
        catch (e) { alert(e.message); }
      }}, 'Add as Due'))));

  // info@ mailbox (read-only)
  const mailBox = h('div', {}, h('div', {class: 'sub'}, 'Loading mailbox…'));
  app.append(panel('Mailbox: info@apex-physio.ca', mailBox));
  loadMail(mailBox);

  // dormant account archive
  (d.archive || []).forEach(a => app.append(panel(`${a.account}: closed / dormant (archive)`,
    h('div', {class: 'sub'}, 'Read-only history. No reminders or alerts for this account. Change it back in Sarah Data\\apex-settings.json if it becomes active again.'),
    table(['Final balance', 'Through', 'Statements', 'Ledger', 'Difference'], [[money(a.final_balance), a.last || '–', `${a.statements} (${a.first || '–'} to ${a.last || '–'})`, money(a.ledger), money(a.difference)]], [0, 3, 4]),
    a.new_activity ? h('div', {class: 'note'}, `${a.new_activity} new statement line(s) appeared on this dormant account. Check the bank if you did not expect them.`) : null)));

  // construction
  const c = s.construction || {};
  if (c.items) {
    app.append(panel('Construction – PrimeRidge', h('div', {class: 'grid'}, card('Contract incl. GST', money(c.contract)), card('Paid per budget', money(c.paid), 'good'), card('Invoiced, due', money(c.due), c.due ? 'warn' : ''), card('Still to invoice', money(c.remaining))),
      table(['Invoice', 'Description', 'Total', 'Budget says', 'Invoice vs ledger'], c.items.map(i =>
        [i.ref, i.desc, money(i.total), i.status, i.check ? pill(i.check, i.check_ok ? 'good' : 'bad') : '–']), [2])));
  }

  // owed / contributions
  const ct = s.contributions || {};
  if (ct.purchase) {
    app.append(panel('Partners: contributions and amounts owed',
      table(['Purchase equity', 'Source', 'Amount', 'Date'], ct.purchase.map(p => [p.who, p.source, money(p.amount), p.date]), [2]),
      h('div', {style: 'height:8px'}),
      table(['OpCo top-up', 'Target', 'Received', 'Status'], ct.topups.map(p => [p.who, money(p.target), money(p.received), pill(p.status, p.status === 'Received' ? 'good' : 'warn')]), [1, 2]),
      h('div', {class: 'note'}, `Owed back: Adeel ${money(k.owed_adeel)} · Zara ${money(k.owed_zara)}.`), ct.warning ? h('div', {class: 'note'}, ct.warning) : null));
  }

  // months & categories
  app.append(panel('Money by month', table(['Month', 'In', 'Out', 'Net'], s.months.map(m => [m.month, money(m.in), money(m.out), money(m.net)]), [1, 2, 3]),
    h('div', {class: 'note'}, 'In and out include transfers between accounts and loan flows.')));
  app.append(panel('Spend by category', table(['Category', 'Amount'], s.categories.map(x => [x.category, money(x.amount)]), [1])));

  // LOC
  const loc = s.loc || {};
  if (loc.facilities) {
    app.append(panel('BMO credit facilities', table(['Facility', 'Limit', 'Drawn', 'Available'], loc.facilities.map(f => [f.name, money(f.limit), money(f.drawn), money(f.available)]), [1, 2, 3]),
      (loc.reminders || []).length ? h('ul', {}, loc.reminders.map(r => h('li', {}, `${r.action} (${r.due})`))) : null));
  }

  // checks
  const inv = d.invoices || {};
  const checks = [];
  (inv.payments_without_invoice || []).forEach(p => checks.push(`Payment with no invoice on file: ${p.date} ${p.desc} ${money(p.amount)}`));
  (inv.invoices_without_payment || []).forEach(p => checks.push(`Invoice with no payment: ${p.file} (${p.why})`));
  s.flags.forEach(f => checks.push(`${f.date} ${f.desc}: ${f.why}`));
  app.append(panel('Checks', checks.length ? h('ul', {}, checks.map(x => h('li', {}, x))) : h('div', {class: 'sub'}, 'No open checks.')));
}
async function load() { try { render(await api('GET', '/api/apex/finance')); } catch (e) { $('status').textContent = e.message; } }
$('scan').onclick = async () => { $('scan').disabled = true; try { render(await api('POST', '/api/apex/scan', {})); } catch (e) { alert(e.message); } $('scan').disabled = false; };
load();
</script>
</body>
</html>
